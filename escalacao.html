/* Página Escalação (Magno, 20/11/2026): os 12 de cada time do Montar Jogo sobre a quadra, fundo transparente para a câmera do Klaus no OBS. Só com login. */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
body:not(.obs){background:linear-gradient(160deg,#4b5563,#1f2937);} /* no navegador comum: fundo escuro; no endereço do OBS (obs=1): transparente para a câmera */
body.teste{background:linear-gradient(160deg,#4b5563,#1f2937);} body.teste::before{content:'(aqui aparece a imagem da câmera do Klaus)';position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:700 22px Arial;color:rgba(255,255,255,.18);}
.palco{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;}
.qd{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:86%;aspect-ratio:1024/557;background:url(quadra_escalacao2.webp) center/100% 100% no-repeat;}
.time{position:absolute;inset:0;display:none;}
.time.on{display:block;}
.escGrande{position:absolute;left:50%;top:4%;transform:translateX(-50%);height:34%;opacity:.45;filter:drop-shadow(0 0 30px rgba(0,0,0,.8));pointer-events:none;}
.abas{position:absolute;left:0;right:0;top:1.6%;display:flex;justify-content:center;gap:8px;z-index:5;}
.abas button{font:700 clamp(12px,2vh,18px) 'Oswald',Arial;letter-spacing:1.5px;text-transform:uppercase;padding:.5em 1.1em;border-radius:999px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);color:#ddd;cursor:pointer;display:flex;align-items:center;gap:.5em;}
.abas{align-items:center;}.abas .abEsc{height:clamp(34px,7vh,64px);filter:drop-shadow(0 2px 6px rgba(0,0,0,.7));}
.abas button.on{background:var(--cor);color:var(--txt);border-color:#fff;}
.cab{position:absolute;left:0;right:0;top:9%;z-index:2;text-align:center;font:700 clamp(18px,3.4vh,34px) 'Oswald',Arial;letter-spacing:2px;text-transform:uppercase;text-shadow:0 2px 8px #000,0 0 2px #000;}
.tec{position:absolute;left:2%;top:3%;display:flex;align-items:center;gap:10px;z-index:4;}.tec.dir{left:auto;right:2%;flex-direction:row-reverse;text-align:right;}.tec .tf{width:clamp(30px,5.5vh,56px);aspect-ratio:1;border-radius:50%;border:3px solid var(--cor);background:#1a2233 center/cover;box-shadow:0 4px 12px rgba(0,0,0,.7);}.tec div{font:700 clamp(12px,2vh,20px) Arial;text-shadow:0 2px 6px #000;}.tec small{display:block;font:700 clamp(10px,1.4vh,13px) 'Oswald',Arial;letter-spacing:2px;color:#ffd54f;text-transform:uppercase;}
.cab small{display:block;font:600 clamp(11px,1.6vh,16px) Arial;letter-spacing:.5px;text-transform:none;opacity:.9;}
.jog{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;width:calc(7.3% * var(--e,1));} /* só a bola muda de tamanho; o nome fica sempre grande para ler na TV */
.jog .foto{position:relative;width:100%;aspect-ratio:1;border-radius:50%;border:3px solid var(--cor);background:#1a2233 center/cover no-repeat;box-shadow:0 4px 14px rgba(0,0,0,.7);}
.jog .num{position:absolute;right:-12%;bottom:-6%;min-width:42%;padding:2px 5px;border-radius:8px;background:var(--cor);color:var(--txt);font:700 clamp(12px,2vh,20px) 'Oswald',Arial;text-align:center;border:2px solid #fff;}
.jog .nm{margin-top:5px;padding:3px 9px;border-radius:7px;background:rgba(0,0,0,.8);font:700 clamp(12px,2vh,21px) Arial;white-space:nowrap;text-align:center;line-height:1.15;}
.jog .nm small{display:block;font-weight:600;color:#ffd54f;font-size:.85em;}
.jog:hover .foto{transform:scale(1.06);}
#ficha{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);}
#ficha.on{display:flex;}
#ficha .c{width:min(86%,460px);background:#fff;color:#111;border-radius:14px;border-top:6px solid var(--cor);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.6);}
#ficha .t{display:flex;gap:14px;align-items:center;padding:14px;}
#ficha .t .f{width:96px;height:96px;border-radius:50%;background:#e9edf2 center/cover;border:3px solid var(--cor);flex:0 0 auto;}
#ficha .t b{font:700 22px 'Oswald',Arial;display:block;}
#ficha .t i{font-style:normal;color:#666;font-weight:700;}
#ficha .tit{text-align:center;font-weight:800;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#555;padding:8px;border-top:1px solid #eee;}

#ficha .g b{display:block;font:700 24px 'Oswald',Arial;}

#painel{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,10,20,.88);}

#painel h1{margin:0 0 10px;font:700 22px 'Oswald',Arial;letter-spacing:2px;text-transform:uppercase;}
#painel .tp{display:flex;gap:6px;margin-bottom:10px;}#painel .tp button{flex:1;padding:9px;border-radius:8px;border:1px solid #2b3d5c;background:#16233b;color:#cfd8e6;font-weight:800;cursor:pointer;}#painel .tp button.on{background:#1e5bd8;color:#fff;border-color:#1e5bd8;}
#painel select{width:100%;padding:10px;border-radius:8px;font-size:15px;margin-bottom:10px;}
#painel .ok{width:100%;padding:11px;border:none;border-radius:8px;background:#e8590c;color:#fff;font-weight:900;font-size:15px;cursor:pointer;}
#painel .dica{font-size:12.5px;color:#9fb0c8;line-height:1.45;margin-top:12px;}#painel .dica code{background:#16233b;padding:2px 6px;border-radius:5px;color:#ffd54f;word-break:break-all;}
#painel .cp{margin-top:6px;padding:6px 10px;border-radius:6px;border:1px solid #2b3d5c;background:#16233b;color:#fff;cursor:pointer;font-weight:700;}
#engr{position:fixed;left:8px;bottom:8px;z-index:15;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.35);color:#fff;font-size:17px;cursor:pointer;opacity:.35;}#engr:hover{opacity:1;}#copiaUrl{position:fixed;left:50px;bottom:8px;z-index:15;padding:8px 14px;border-radius:999px;border:none;background:#e8590c;color:#fff;font-weight:800;cursor:pointer;display:none;}body.temJogo:not(.obs) #copiaUrl{display:block;}body.obs #engr{opacity:0;}body.obs #engr:hover{opacity:1;} /* no OBS a engrenagem só aparece com o mouse em cima (janela Interagir) */
.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:10px;background:rgba(0,0,0,.7);font-weight:700;}

/* filtros fixos no canto (Magno, 20/11/2026): Categoria > Time > Jogo (data); ficam na tela depois de escolher; no OBS ficam escondidos */
#filtros{position:fixed;left:10px;top:10px;z-index:16;display:flex;flex-direction:column;gap:5px;width:250px;padding:8px;border-radius:10px;background:rgba(10,18,32,.88);border:1px solid #2b3d5c;font:12px Arial;}

#filtros .cpF{margin-top:3px;padding:7px;border:none;border-radius:7px;background:#e8590c;color:#fff;font-weight:800;cursor:pointer;}#filtros a.volta{display:block;text-align:center;text-decoration:none;background:#1b2a4a;border:1px solid #3b5583;font:800 12px Arial;} /* botão de voltar (Magno, 20/11/2026): a página não tem menu por causa do OBS */
body.obs #filtros,#engr,#copiaUrl{display:none!important;}
.abas{align-items:flex-start!important;}
.abL{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:clamp(80px,14vh,150px);}
.tm{display:none;flex-direction:column;align-items:center;gap:3px;text-align:center;}

.tm small{font:700 clamp(9px,1.3vh,12px) 'Oswald',Arial;letter-spacing:2px;color:#ffd54f;text-transform:uppercase;text-shadow:0 1px 4px #000;}
.tm b{font:700 clamp(11px,1.8vh,17px) Arial;text-shadow:0 2px 6px #000;max-width:18vh;}

/* tamanhos proporcionais à quadra: no OBS fica igual à tela do computador, em qualquer tamanho (Magno, 20/11/2026) */
.qd{container-type:size;}
.jog{transform:translate(-50%,0)!important;} /* a posição marca o topo da bola: o nome comprido não empurra a bola */

/* topo novo (Magno, 20/11/2026) */

.cab{top:10.3%!important;font-size:clamp(16px,3.5vh,38px)!important;line-height:1.1;}.cab .cabK{display:block;font-size:.52em;letter-spacing:.25em;opacity:.95;} /* mais perto da tabela; 'Escalação Klaus TV' na metade do tamanho */ /* 'Escalação Klaus TV' em cima do nome do time, mesma letra e tamanho; um pouco afastado da tabela (Magno, 20/11/2026) */

.tm .tAp{font-style:normal;font-weight:700;font-size:1.9vh;color:#ffd54f;text-shadow:0 2px 6px #000;margin-top:-.4vh;}
/* logo Klaus TV (Magno, 20/11/2026) */

#sf{position:absolute;inset:0;container-type:size;display:none;font-family:'Oswald',Arial,sans-serif;z-index:2;}

<body>
<div class="palco" id="palco"><div id="times"></div><div id="sf"></div>
  <div class="abas" id="abas"></div>

</div>

<button id="engr" title="Escolher outro jogo" onclick="painel(true)">⚙</button>

<div id="painel" class="fora"><div class="pc"><h1>Escalação</h1>
  <div class="tp"><button id="tpP" class="on" onclick="tipo('P')">Próximos jogos</button><button id="tpA" onclick="tipo('A')">Jogos anteriores</button></div>
  <select id="selJ"><option>Carregando jogos…</option></select>
  <button class="ok" onclick="escolher()">Mostrar escalação</button>
  <div class="dica" id="dica"></div></div></div>
<script src="sumula.js"></script>
<script>
// posições dos 12 na quadra (em % da imagem da quadra) e escala pela profundidade (Magno, 20/11/2026):
// frente (maiores) = quem mais jogou no time na temporada; fundo (menores) = quem menos jogou
const POS=[[12,71,1.05],[37,71,1.05],[63,71,1.05],[88,71,1.05],
  [17,50,1.05],[50,50,1.05],[83,50,1.05],
  [28,29.3,1.05],[50,29.3,1.05],[72,29.3,1.05],
  [40,5.8,1.05],[60,5.8,1.05]]; // quadra larga sem a tabela da frente (Magno, 20/11/2026): jogadores espalhados, fileira da frente mais alta para o nome não ficar na borda // fileiras mais afastadas para o nome não cair na foto de trás (Magno, 20/11/2026) // todas do mesmo tamanho (Magno, 20/11/2026); a ordem continua: na frente quem mais jogou
// camisa menor no fundo (perto da cesta) e maior na frente; em cada fileira da esquerda para a direita
const ORDEM=[10,11,7,8,9,4,5,6,0,1,2,3];
const D={"cores":{"ABIG":["#1F4E79","#FFFFFF"],"ACEAR":["#E2231A","#FFFFFF"],"ASPCM":["#2E3192","#E2231A"],"BFR":["#000000","#FFFFFF"],"BSA":["#F28C28","#FFFFFF"],"CCL":["#1F5FBF","#FFFFFF"],"CESC":["#000000","#FFFFFF"],"CFCSN":["#7B1E22","#FFFFFF"],"CK":["#1A1A1A","#B8860B"],"CRF":["#C8102E","#000000"],"EEPZ":["#1B2A4A","#F28C28"],"FFC":["#7A0026","#00613C"],"IB":["#E06A2C","#000000"],"IDEC":["#1F4E5F","#A4C639"],"IG":["#1F2E8A","#F07A1A"],"ITDA":["#0B1F4B","#FFFFFF"],"JTC":["#2E3448","#F2D33B"],"KE":["#000000","#FFD200"],"MB":["#1A1A1A","#F28C28"],"NBC":["#E2231A","#000000"],"TKA":["#1E8C3A","#F2C200"],"TTC":["#E2231A","#FFFFFF"]},"escudos":{"ABIG":"escudos/ABIG.png","ACEAR":"escudos/ACEAR.png","ASPCM":"escudos/ASPCM.png","BFR":"escudos/BFR.png","BSA":"escudos/BSA.png","CCL":"escudos/CCL.png","CESC":"escudos/CESC.png","CFCSN":"escudos/CFCSN.png","CK":"escudos/CK.png","CRF":"escudos/CRF.png","EEPZ":"escudos/EEPZ.png","FFC":"escudos/FFC.png","IB":"escudos/IB.png","IDEC":"escudos/IDEC.png","IG":"escudos/IG.png","ITDA":"escudos/ITDA.png","JTC":"escudos/JTC.png","KE":"escudos/KE.png","MB":"escudos/MB.png","NBC":"escudos/NBC.png","TKA":"escudos/TKA.png","TTC":"escudos/TTC.png"},"curto":{"BSA":"Basquete S.A.","BFR":"Botafogo","CRF":"Flamengo","CFCSN":"Funcionários","FFC":"Fluminense","TTC":"Tijuca","NBC":"Niterói","CCL":"Leopoldinense","IG":"Iguaba Grande","ABIG":"Jequiá","ACEAR":"Irajá","CESC":"Suzano Costa","EEPZ":"Passo Zero","IDEC":"IDEC","ITDA":"Atitude","KE":"K. Esportes","MB":"Mesquita","JTC":"Jacarepaguá","TKA":"Team Klun","ASPCM":"Municipal","CK":"Carioca King's","IB":"Itaipu","NBR":"NBR Campos"}}; // cores, escudos e nomes curtos (cópia do Ao vivo)
const KT_API='https://script.google.com/macros/s/AKfycbxJBusZKcHRLpV9_qG4Gs6_8b37Dp5lj5OSXXXdcMRNrRnrO_K1sLo3MiQQ_wEjDx-S/exec';
async function api(d){ let ult='';
  for(let t=0;t<3;t++){ try{ const r=await fetch(KT_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)}); const x=await r.json(); if(x&&x.ok) return x; ult=(x&&x.erro)||'resposta sem dados'; }catch(e){ ult='sem conexão com o servidor ('+(e&&e.message||e)+')'; }
    await new Promise(ok=>setTimeout(ok,1200)); }
  return {ok:false,erro:ult}; } // tenta 3 vezes e guarda o motivo (Magno, 20/11/2026)
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cor=s=>(D.cores[s]||['#1e90ff','#ffffff'])[0];
const txt=h=>{ const n=parseInt(String(h).slice(1),16); return ((n>>16)*.299+((n>>8)&255)*.587+(n&255)*.114)>150?'#000':'#fff'; };
const escudo=s=>D.escudos[s]||'favicon.svg';
const nome2=n=>{ const w=String(n||'').trim().split(/\s+/).filter(Boolean); return w.length<=1?(w[0]||''):w[0]+' '+w[w.length-1]; };
const dataJ=j=>{ const d=new Date(String(j.dataHora||'').replace(' ','T')); return isNaN(d)?null:d; };
function status(j){ if(j.status==='FINAL') return 'final'; const d=dataJ(j); if(!d) return 'breve'; const a=Date.now(); if(a<d.getTime()-10*60e3) return 'breve'; if(a>d.getTime()+3*3600e3) return 'final'; return 'vivo'; }
let LISTA=[], TIPO='P', J=null, FOTOS={}, APS={}, TEMP=null;
const Q=new URLSearchParams(location.search);
if(Q.has('teste')) document.body.classList.add('teste');
if(Q.has('obs')||window.obsstudio) document.body.classList.add('obs'); // dentro do OBS o fundo fica transparente sozinho

function rotulo(j){ const d=dataJ(j); return (j.categoria||'Avulso')+' · '+(D.curto[j.timeA]||j.timeA)+' x '+(D.curto[j.timeB]||j.timeB)+(d?' · '+d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''); }
async function carregarLista(){ const r=await api({acao:'aoVivoLista',categoria:''}); LISTA=(r&&r.ok&&r.jogos)||[]; fMonta(); }
function tipo(t){ TIPO=t; $('tpP').classList.toggle('on',t==='P'); $('tpA').classList.toggle('on',t==='A');
  const tm=j=>{ const d=dataJ(j); return d?d.getTime():0; };
  const ls=LISTA.filter(j=>t==='A'?status(j)==='final':status(j)!=='final').sort((a,b)=>t==='A'?tm(b)-tm(a):tm(a)-tm(b));
  $('selJ').innerHTML=ls.length?ls.map(j=>`<option value="${esc(j.id)}">${esc(rotulo(j))}</option>`).join(''):`<option value="">Nenhum jogo ${t==='A'?'anterior':'montado para os próximos dias'}</option>`;
  if(J&&ls.some(x=>x.id===J.id)) $('selJ').value=J.id; dica(); }
function dica(){ const id=$('selJ').value; const base=location.origin+location.pathname;
  $('dica').innerHTML=id?`<b>No OBS</b> (fonte <b>Navegador</b>, 1920 × 1080), cole a <b>URL de saída</b> deste jogo (não pede login):<br>clique em <b>Mostrar escalação</b> e depois no botão laranja <b>📋 Copiar URL de saída (OBS)</b>, no canto de baixo.<br>A troca entre Casa e Visitante é feita nas abas (no OBS, pelo botão <b>Interagir</b>). O fundo fica transparente: aparece a câmera.`:''; }
/* URL de saída com os dados dentro (Magno, 20/11/2026): o navegador do OBS não consegue buscar no servidor do Google ("Failed to fetch"),
   então o Chrome (com login) monta a escalação e põe tudo no endereço, depois do #. No OBS a página não busca nada na internet. */
const b64e=o=>{ const by=new TextEncoder().encode(JSON.stringify(o)); let s=''; by.forEach(c=>s+=String.fromCharCode(c)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const b64d=t=>{ t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; const s=atob(t); const by=new Uint8Array(s.length); for(let i=0;i<s.length;i++) by[i]=s.charCodeAt(i); return JSON.parse(new TextDecoder().decode(by)); };
const fid=u=>{ const m=/\/d\/([^=/?]+)/.exec(String(u||'')); return m?m[1]:''; };
const furl=id=>id?'https://lh3.googleusercontent.com/d/'+id+'=w600':'';
function pacote(){ const m=J.meta||{}; const o={v:1,id:J.id,c:J.categoria,d:J.dataHora};
  ['A','B'].forEach(l=>{ const t=m['time'+l]||{}, sig=t.sigla||(l==='A'?J.timeA:J.timeB), kTec='TEC-'+sig+'-'+String(J.categoria||'').replace(/[^A-Za-z0-9]/g,'');
    o[l]={s:sig,t:((t.tecnico&&t.tecnico.nome)||APS[kTec]||'').trim(),tf:fid(FOTOS[kTec]),
      j:(t.atletas||[]).map(a=>{ const x=somaTemp(a.reg)||{qtd:0}; return [String(a.reg),a.nome||'',a.numero||'',APS[a.reg]||a.apelido||'',fid(FOTOS[a.reg]),x.qtd||0,x.pts||0,x.reb||0,x.ast||0,x.stl||0,x.blk||0,x.eff||0,x.mvp||0]; })}; });
  return b64e(o); }
function dePacote(t){ const o=b64d(t); FOTOS={}; APS={}; PRE={}; const meta={};
  ['A','B'].forEach(l=>{ const x=o[l]||{j:[]}; const kTec='TEC-'+x.s+'-'+String(o.c||'').replace(/[^A-Za-z0-9]/g,''); if(x.tf) FOTOS[kTec]=furl(x.tf);
    meta['time'+l]={sigla:x.s,tecnico:{nome:x.t||''},atletas:x.j.map(r=>{ if(r[4]) FOTOS[r[0]]=furl(r[4]); if(r[3]) APS[r[0]]=r[3];
      PRE[r[0]]={qtd:r[5],pts:r[6],reb:r[7],ast:r[8],stl:r[9],blk:r[10],eff:r[11],mvp:r[12]}; return {reg:r[0],nome:r[1],numero:r[2]}; })}; });
  J={id:o.id,categoria:o.c,dataHora:o.d,timeA:meta.timeA.sigla,timeB:meta.timeB.sigla,meta}; TEMP={ok:true,ks:[],jogos:[]}; }
function copiaSaida(b){
  const u=location.origin+location.pathname.replace(/\.html$/,'')+'?obs=1&scout=1&mod='+MODELO; // ligada ao Scout (Magno, 24/11/2026): o OBS mostra sempre o jogo aberto no Scout // v= muda a cada cópia: o OBS não usa a cópia velha guardada
  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{ b.textContent='✓ Copiado! Cole no OBS (fonte Navegador)'; setTimeout(()=>b.textContent='📋 Copiar URL de saída (OBS)',2500); }).catch(()=>prompt('Copie a URL de saída:',u)); }

// ---------- filtros fixos: Categoria > Time > Jogo ----------
function fMonta(){ const cats=[...new Set(LISTA.map(j=>j.categoria||'Avulso'))].sort((a,b)=>(parseInt(a.replace(/\D/g,''))||99)-(parseInt(b.replace(/\D/g,''))||99));
  const cAtual=(J&&J.categoria)||$('fCat').value||cats[0]||'';
  $('fCat').innerHTML=cats.map(c=>`<option${c===cAtual?' selected':''}>${esc(c)}</option>`).join('')||'<option>—</option>'; fTimes(J&&J.id); }
function fTimes(idSel){ const c=$('fCat').value; const js=LISTA.filter(j=>(j.categoria||'Avulso')===c);
  const ts=[...new Set(js.flatMap(j=>[j.timeA,j.timeB]))].filter(Boolean).sort((a,b)=>String(D.curto[a]||a).localeCompare(String(D.curto[b]||b)));
  const jSel=idSel&&LISTA.find(j=>j.id===idSel); const tAt=(jSel&&(ts.includes($('fTime').value)&&[jSel.timeA,jSel.timeB].includes($('fTime').value)?$('fTime').value:jSel.timeA))||'';
  $('fTime').innerHTML='<option value="">Todos os times</option>'+ts.map(t=>`<option value="${esc(t)}"${t===tAt?' selected':''}>${esc(D.curto[t]||t)}</option>`).join(''); fJogos(idSel); }
function fJogos(idSel){ const c=$('fCat').value, t=$('fTime').value; const tm=j=>{ const d=dataJ(j); return d?d.getTime():0; };
  const js=LISTA.filter(j=>(j.categoria||'Avulso')===c&&(!t||j.timeA===t||j.timeB===t)).sort((a,b)=>tm(b)-tm(a));
  const rot=j=>{ const d=dataJ(j), st=status(j); return (st==='final'?'⚪ ':st==='vivo'?'🔴 ':'🟡 ')+(d?d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · ':'')+(D.curto[j.timeA]||j.timeA)+' x '+(D.curto[j.timeB]||j.timeB); };
  $('fJogo').innerHTML='<option value="">— escolha o jogo ('+js.length+') —</option>'+js.map(j=>`<option value="${esc(j.id)}"${j.id===idSel?' selected':''}>${esc(rot(j))}</option>`).join(''); }
document.addEventListener('change',e=>{ if(e.target.id==='fCat') fTimes(); else if(e.target.id==='fTime') fJogos(); else if(e.target.id==='fJogo'&&e.target.value){ const id=e.target.value; try{ localStorage.setItem('kt_esc_jogo',id); }catch(x){} const u=new URL(location); u.searchParams.set('jogo',id); u.hash=''; history.replaceState(null,'',u); abrir(id); } });
function painel(on){ if(!LISTA.length) carregarLista(); } // o painel grande saiu: agora são os filtros fixos no canto
function escolher(){ const id=$('selJ').value; if(!id) return; try{ localStorage.setItem('kt_esc_jogo',id); }catch(e){} const u=new URL(location); u.searchParams.set('jogo',id); history.replaceState(null,'',u); painel(false); abrir(id); }
document.addEventListener('change',e=>{ if(e.target.id==='selJ') dica(); });

async function abrir(id){ $('times').innerHTML='<div class="msg">Carregando a escalação…</div>'; $('abas').innerHTML='';
  const r=await api({acao:'aoVivoJogo',id});
  if(!r||!r.ok||!r.jogo){ $('times').innerHTML='<div class="msg">Não foi possível abrir este jogo agora.<br><small style="font-weight:400">Jogo: '+esc(id)+' · Motivo: '+esc((r&&r.erro)||'desconhecido')+'</small><br><button class="cp" style="margin-top:8px" onclick="abrir(\''+esc(id)+'\')">Tentar de novo</button></div>'; return; }
  document.body.classList.add('temJogo'); J=r.jogo; FOTOS=r.fotos||{}; APS=r.apelidos||{}; TEMP=null; camBanco(); fotoTec(); monta(); if(LISTA.length) fMonta(); camBancoNovo();
  const ano=String(J.dataHora||'').slice(0,4)||String(new Date().getFullYear());
  if(J.categoria) api({acao:'atletasKT',categoria:J.categoria,ano}).then(x=>{ TEMP=(x&&x.ok)?x:{ok:false}; const l=$('tB')&&$('tB').classList.contains('on')?'B':'A'; monta(); aba(l); }); }

// camisa do Banco de dados (Magno, 20/11/2026): jogador salvo no Montar Jogo ainda sem número (ex.: camisa cadastrada depois)
// pega a camisa da categoria no Banco de dados (ou a camisa padrão). Só preenche quem está sem número; camisa só do jogo não muda.
let CAMS={}; try{ CAMS=JSON.parse(localStorage.getItem('klaustv_camisas_v1')||'{}')||{}; }catch(e){}
function camBanco(){ if(!J) return; const ck=String(J.categoria||'').replace(/[^A-Za-z0-9]/g,''); const m=J.meta||{}; let mud=false;
  ['A','B'].forEach(l=>((m['time'+l]||{}).atletas||[]).forEach(a=>{ if(String(a.numero||'').trim()||a.camisaJogo) return;
    const n=CAMS[a.reg+'-'+ck]!==undefined?CAMS[a.reg+'-'+ck]:CAMS[a.reg]; if(n!==undefined&&String(n).trim()){ a.numero=String(n).padStart(2,'0'); mud=true; } })); return mud; }
function camBancoNovo(){ let tok=''; try{ tok=localStorage.getItem('klaustv_token_v1')||''; }catch(e){} if(!tok) return;
  api({acao:'listarFotos',token:tok}).then(x=>{ if(!x||!x.ok) return; CAMS=x.camisas||{}; try{ localStorage.setItem('klaustv_camisas_v1',JSON.stringify(CAMS)); }catch(e){}
    if(camBanco()){ const l=$('tB')&&$('tB').classList.contains('on')?'B':'A'; monta(); aba(l); } }).catch(()=>{}); }
// foto do técnico (Magno, 20/11/2026): se não tiver na categoria do jogo, usa a do mesmo técnico (mesmo time e mesmo nome) em outra categoria
function fotoTec(){ const nz=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim().toLowerCase();
  const m=J.meta||{}; ['A','B'].forEach(l=>{ const t=m['time'+l]||{}, sig=t.sigla||(l==='A'?J.timeA:J.timeB), k='TEC-'+sig+'-'+String(J.categoria||'').replace(/[^A-Za-z0-9]/g,'');
    if(FOTOS[k]) return; const nome=nz((t.tecnico&&t.tecnico.nome)||APS[k]); if(!nome) return;
    const outra=Object.keys(FOTOS).find(x=>x.indexOf('TEC-'+sig+'-')===0&&nz(APS[x])===nome); if(outra) FOTOS[k]=FOTOS[outra]; }); }
// técnico (Magno, 20/11/2026): primeiro e último nome; o apelido (entre parênteses ou aspas) vai embaixo
function tecCurto(t){ t=String(t||''); let a=''; const m=/[\(“\"]([^\)”\"]+)[\)”\"]/.exec(t); if(m){ a=m[1].trim(); t=t.replace(m[0],' '); } const w=nome2(t).split(' '); return {n:w.length>1?w[0].charAt(0)+'. '+w[w.length-1]:w[0],a}; } // técnico: inicial do primeiro nome + último nome, ex.: L. Monteiro (Magno, 21/11/2026)
// caixa do nome do time (Magno, 20/11/2026): cor predominante do brasão; se for clara demais para letra branca, usa a 2ª ou a 3ª cor
function corCaixa(sig){ const lum=h=>{ const n=parseInt(String(h).slice(1),16); return (n>>16)*.299+((n>>8)&255)*.587+(n&255)*.114; };
  const c=(D.cores[sig]||[]).find(x=>/^#[0-9a-f]{6}$/i.test(x)&&lum(x)<175); return c||'#1b2a4a'; }
function timeDe(l){ const m=J.meta||{}, t=m['time'+l]||{}, sig=t.sigla||(l==='A'?J.timeA:J.timeB); const c=cor(sig);
  const kTec='TEC-'+sig+'-'+String(J.categoria||'').replace(/[^A-Za-z0-9]/g,'');
  return {sig,nome:D.curto[sig]||t.nome||sig||'',cor:c,txt:txt(c),tec:((t.tecnico&&t.tecnico.nome)||APS[kTec]||'').trim(),tecF:FOTOS[kTec]||'bola_fiba.png',
    js:(t.atletas||[]).slice().sort((a,b)=>((parseInt(a.numero)||999)-(parseInt(b.numero)||999))||String(a.numero).localeCompare(String(b.numero))).slice(0,12)}; } // ordem da camisa, menor para maior (Magno, 20/11/2026)
function monta(){ const T={A:timeDe('A'),B:timeDe('B')}; window.KT_T=T;
  $('times').innerHTML=['A','B'].map(l=>{ const t=T[l];
    return `<div class="time${l==='A'?' on':''}" id="t${l}" style="--cor:${t.cor};--txt:${t.txt}">
      
      <div class="cab"><span class="cabBox" style="background:${corCaixa(t.sig)}"><span class="cabK">Escalação Klaus TV</span>${esc(t.nome)}</span></div>
      <div class="qd">${t.js.map((a,i)=>{ const [x,y,e]=POS[ORDEM[i]]; const ap=APS[a.reg]||a.apelido||'';
        return `<div class="jog" style="left:${x}%;top:${y}%;--e:${e}" onclick="ficha('${l}',${i})"><div class="foto" style="background-image:url('${esc(FOTOS[a.reg]||'bola_fiba.png')}')"><span class="num">${esc(a.numero||'-')}</span></div><div class="nm">${esc(nome2(a.nome))}${ap?'<small>'+esc(ap)+'</small>':''}</div></div>`; }).join('')}</div></div>`; }).join('');
  const bt=l=>`<button id="b${l}" class="${l==='A'?'on':''}" style="--cor:${T[l].cor};--txt:${T[l].txt}" onclick="aba('${l}')">${esc(T[l].nome)}</button>`;
  const tm=l=>`<div class="tm${l==='A'?' on':''}" id="tm${l}" style="--cor:${T[l].cor}">${T[l].tec?`<div class="tf" style="background-image:url('${esc(T[l].tecF)}')" onclick="tecFicha('${l}')" title="Ver foto do técnico"></div><small>Técnico</small><b>${esc(tecCurto(T[l].tec).n)}</b>${tecCurto(T[l].tec).a?`<i class="tAp">${esc(tecCurto(T[l].tec).a)}</i>`:''}`:''}</div>`;
  // layout (Magno, 20/11/2026): casa sempre à esquerda e visitante à direita, alinhados com o topo da tabela de basquete; botão discreto, escudo e técnico em destaque
  $('abas').innerHTML=`<div class="lado lA">${bt('A')}<img class="abEsc" src="${escudo(T.A.sig)}" alt="" onclick="aba('A')" title="Mostrar ${esc(T.A.nome)}">${tm('A')}</div><div class="lado lB">${bt('B')}<img class="abEsc" src="${escudo(T.B.sig)}" alt="" onclick="aba('B')" title="Mostrar ${esc(T.B.nome)}">${tm('B')}</div>`; // troca de time clicando no escudo (Magno, 20/11/2026)
  // pré-carrega as fotos dos dois times: a troca de aba é instantânea
  [...T.A.js,...T.B.js].forEach(a=>{ if(FOTOS[a.reg]){ const im=new Image(); im.src=FOTOS[a.reg]; } }); montaSF(T); }
// técnico: só a foto grande e o nome (Magno, 20/11/2026)
function tecFicha(l){ const t=KT_T[l]; const c=$('fichaC'); c.style.setProperty('--cor',t.cor);
  c.innerHTML=`<div style="padding:18px;text-align:center"><div style="width:min(60vh,300px);aspect-ratio:1;margin:0 auto;border-radius:50%;border:5px solid ${t.cor};background:#e9edf2 url('${esc(t.tecF)}') center/cover"></div>
    <div style="margin-top:12px;font:700 13px 'Oswald',Arial;letter-spacing:2px;color:#888;text-transform:uppercase">Técnico · ${esc(t.nome)}</div><div style="font:700 26px 'Oswald',Arial">${esc(t.tec)}</div></div>`;
  $('ficha').classList.add('on'); }
function aba(l){ ['A','B'].forEach(x=>{ $('t'+x).classList.toggle('on',x===l); $('b'+x).classList.toggle('on',x===l); const tm=$('tm'+x); if(tm) tm.classList.toggle('on',x===l); }); /* só o técnico do time que está na tela (Magno, 21/11/2026) */ $('ficha').classList.remove('on'); }

// ficha: estatística geral do atleta na temporada (jogos narrados pelo Klaus TV)
let PRE=null; // estatísticas que vieram prontas dentro da URL de saída (OBS)
function somaTemp(reg){ if(PRE) return PRE[String(reg)]||{qtd:0,pts:0,reb:0,ast:0,stl:0,blk:0,eff:0,mvp:0}; if(!TEMP||!TEMP.ok) return null; const KS=TEMP.ks; let o={qtd:0}; KS.forEach(k=>o[k]=0); let mvp=0;
  (TEMP.jogos||[]).forEach(g=>{ const ps=g.p.map(r=>{ const s={}; KS.forEach((k,i)=>s[k]=+r[3+i]||0); return {reg:String(r[0]),s}; });
    const me=ps.find(p=>p.reg===String(reg)); if(!me) return; o.qtd++; KS.forEach(k=>o[k]+=me.s[k]);
    const top=ps.slice().sort((a,b)=>(b.s.eff-a.s.eff)||(b.s.pts-a.s.pts))[0]; if(top&&top.reg===String(reg)&&top.s.eff>0) mvp++; });
  o.mvp=mvp; return o; }
function ficha(l,i){ const t=KT_T[l], a=t.js[i]; const ap=APS[a.reg]||a.apelido||''; const o=somaTemp(a.reg);
  const f1=x=>(Math.round(x*10)/10).toFixed(1).replace('.',',');
  const md=k=>o&&o.qtd?f1((+o[k]||0)/o.qtd):'0,0';
  const st=o?[['JOGOS',o.qtd],['PTS',md('pts')],['REB',md('reb')],['AST',md('ast')],['ROU',md('stl')],['TOC',md('blk')],['EF',md('eff')],['MVP',o.mvp]]:null;
  const c=$('fichaC'); c.style.setProperty('--cor',t.cor);
  c.innerHTML=`<div class="t"><div class="f" style="background-image:url('${esc(FOTOS[a.reg]||'bola_fiba.png')}')"></div><div><b>${esc(a.nome)}</b>${ap?'<i>'+esc(ap)+'</i>':''}<div style="margin-top:6px;font-weight:800">#${esc(a.numero||'-')} · ${esc(t.nome)}</div></div></div>
    <div class="tit">Temporada ${esc(String(J.dataHora||'').slice(0,4))} · ${esc(J.categoria||'')} · média por jogo narrado</div>
    ${st?`<div class="g">${st.map(([s,v])=>`<div><b>${v}</b><span>${s}</span></div>`).join('')}</div>`:`<div style="padding:14px;text-align:center;color:#666">${TEMP?'Sem estatísticas da temporada agora.':'Carregando as estatísticas…'}</div>`}`;
  $('ficha').classList.add('on'); }


// ===== Modelo da escalação (Magno, 23/11/2026): Automático (com fotos se metade ou mais tiver foto) / Com fotos / Sem fotos; vai na URL de saída (mod=) =====
let MODELO=(Q.get('mod')||'').toLowerCase(); if(!['auto','fotos','sem'].includes(MODELO)){ try{ MODELO=localStorage.getItem('kt_esc_mod')||'auto'; }catch(e){ MODELO='auto'; } } if(!['auto','fotos','sem'].includes(MODELO)) MODELO='auto';
$('fMod').value=MODELO;
document.addEventListener('change',e=>{ if(e.target.id!=='fMod') return; MODELO=e.target.value; try{ localStorage.setItem('kt_esc_mod',MODELO); }catch(x){} const u=new URL(location); u.searchParams.set('mod',MODELO); history.replaceState(null,'',u); if(window.KT_T) montaSF(KT_T); });
const hex2=h=>{ const n=parseInt(String(h).slice(1),16); return [n>>16,(n>>8)&255,n&255]; };
const lumH=h=>{ const [r,g,b]=hex2(h); return r*.299+g*.587+b*.114; };
const dist=(a,b)=>{ const x=hex2(a),y=hex2(b); return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]); };
// paleta de cada time pelas cores do brasão (Magno, 23/11/2026): só cores que o time tem
const PAL={"ABIG":["#1F4E79","#FFFFFF"],"ACEAR":["#E2231A","#FFFFFF"],"ASPCM":["#2E3192","#E2231A","#FFFFFF"],"BFR":["#000000","#FFFFFF"],"BSA":["#F28C28","#FFFFFF"],"CCL":["#1F5FBF","#FFFFFF"],"CESC":["#000000","#FFFFFF"],"CFCSN":["#7B1E22","#FFFFFF"],"CK":["#1A1A1A","#B8860B"],"CRF":["#C8102E","#000000","#FFFFFF"],"EEPZ":["#1B2A4A","#F28C28"],"FFC":["#7A0026","#00613C","#FFFFFF"],"IB":["#E06A2C","#000000","#FFFFFF"],"IDEC":["#A4C639","#123A3F"],"IG":["#1F2E8A","#F07A1A","#FFFFFF"],"ITDA":["#0B1F4B","#FFFFFF"],"JTC":["#2E3448","#F2D33B"],"KE":["#000000","#FFD200"],"MB":["#1A1A1A","#F28C28","#FFFFFF"],"NBC":["#E2231A","#000000","#FFFFFF"],"TKA":["#1E8C3A","#F2C200","#0E4A1E"],"TTC":["#E2231A","#FFFFFF"]};
const _hx=h=>{ const n=parseInt(String(h).slice(1),16); return [n>>16,(n>>8)&255,n&255]; }, _lu=h=>{ const [r,g,b]=_hx(h); return r*.299+g*.587+b*.114; }, _di=(a,b)=>{ const x=_hx(a),y=_hx(b); return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2]); };
// tema do lado do time: escuro (fundo na cor escura do time, letra branca) ou claro (fundo branco, letra escura) – nunca usa preto em time que não tem preto
function temaTime(sig,forca){ const p=PAL[sig]||((window.D&&D.cores[sig])||['#1e90ff','#ffffff']);
  const esc=p.find(c=>_lu(c)<50), bra=p.some(c=>_lu(c)>=230);
  let dark=forca?forca==='escuro':(!!esc||!bra);
  const bg=dark?(esc||p.find(c=>_lu(c)<230)||'#000'):'#FFFFFF';
  const acc=p.find(c=>c!==bg&&_lu(c)>=40&&_lu(c)<230)||(dark?'#D9D9D9':(esc||'#222'));
  return {sig,dark,bg,acc,txt:dark?'#FFFFFF':(esc||'#111111'),pal:p,esc,bra}; }
function temasDuelo(a,b){ const A=temaTime(a); let B=temaTime(b);
  if(_di(A.acc,B.acc)<110 && A.dark===B.dark){ // cores parecidas no mesmo tipo de fundo: o visitante muda
    if(B.esc&&B.bra){ B=temaTime(b,A.dark?'claro':'escuro'); }
    if(_di(A.acc,B.acc)<110 && A.dark===B.dark){ const o=B.pal.find(c=>c!==B.bg&&_lu(c)>=40&&_lu(c)<230&&_di(A.acc,c)>=110); B.acc=o||'#F2C200'; } }
  return {A,B}; }
const TERCEIRA='#F2C200'; // terceira cor quando os dois times ficam parecidos (amarelo-ouro)
// cor de destaque do time: a principal; se for preta/escura demais, prata (como o Botafogo do modelo)
function destaque(sig){ const c=(D.cores[sig]||['#1e90ff','#ffffff']); return lumH(c[0])<40?'#d9d9d9':c[0]; }
function coresSF(sA,sB){ const a=destaque(sA); let b=destaque(sB);
  if(dist(a,b)<110){ const c2=(D.cores[sB]||[])[1]; b=(c2&&dist(a,c2)>=110&&lumH(c2)>=40)?c2:(dist(a,TERCEIRA)>=110?TERCEIRA:'#1e88e5'); } // cores coincidem: o visitante muda
  return {A:a,B:b}; }
function estilo(t){ const c=t.acc, nt=_lu(c)>150?'#000':'#fff', claro=_lu(c)>200;
  const rb1=t.dark?(t.bg==='#000000'||_lu(t.bg)<20?'#26262a':mix(t.bg,'#ffffff',.18)):'#ffffff', rb2=t.dark?(_lu(t.bg)<20?'#000':mix(t.bg,'#000000',.35)):'#e2e2e2';
  const htx=t.dark?'#fff':(_lu(c)<170?c:t.txt);
  return `--glow:${c}99;--brd:linear-gradient(180deg,#fff,${c} 35%,${c} 70%,${t.dark?'#555':'#999'});--brd1:${c};--nb1:${c};--nb2:${claro?'#a9a9a9':c+'cc'};--ntx:${nt};--sub:${t.dark?(claro||Math.abs(_lu(c)-_lu(t.bg))<50?'#e6e6e6':c):(_lu(c)<200?c:t.txt)};--rb1:${rb1};--rb2:${rb2};--rtx:${t.txt};--pbg:${t.dark?mix(t.bg,'#000000',.5)+'eb':'rgba(255,255,255,.95)'};--htx:${htx};--apl:${t.dark?'#ffd54f':c}`; }
function mix(a,b,k){ const x=_hx(a),y=_hx(b); return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*k).toString(16).padStart(2,'0')).join(''); }
function modeloReal(T){ if(MODELO!=='auto') return MODELO; const js=[...T.A.js,...T.B.js]; if(!js.length) return 'fotos'; const c=js.filter(a=>FOTOS[a.reg]).length; return c*2>=js.length?'fotos':'sem'; }

// pinceladas nos cantos (Magno, 23/11/2026): cor do time da casa à esquerda, do visitante à direita; leve (desenho em código, sem imagem)
function decoSF(c){ const esc_=lumH(c)<60?'#888':c; const L=[[60,30,1],[104,10,.9],[134,20,.95],[176,6,.8],[206,14,.7],[240,4,.6]];
  return `<svg viewBox="0 0 300 300" preserveAspectRatio="none"><g filter="url(#sfRasp)" mask="url(#sfFade)">${L.map(([o,w,a],i)=>`<line x1="${o+40}" y1="-20" x2="-20" y2="${o+40}" stroke="${i%3===2?'#fff':c}" stroke-opacity="${i%3===2?a*.55:a}" stroke-width="${w}" stroke-linecap="butt"/>`).join('')}<polygon points="-10,-10 95,-10 -10,95" fill="${c}" opacity=".95"/></g></svg>`; }
const SF_DEFS='<svg width="0" height="0" style="position:absolute"><defs><filter id="sfRasp" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".5 .025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="9" xChannelSelector="R" yChannelSelector="G"/></filter><radialGradient id="sfG" cx="0" cy="0" r="1"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="sfFade" maskUnits="userSpaceOnUse" x="-30" y="-30" width="360" height="360"><rect x="-30" y="-30" width="360" height="360" fill="url(#sfG)"/></mask></defs></svg>';
let SF_VER='AB';
const REGATA='<svg viewBox="0 0 40 44"><defs><linearGradient id="rgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="M9 1.5h5Q19 10.5 24 1.5h5v5.4q1.4 7.6 7.5 8.6V42.5H1.5V15.5Q7.6 14.5 9 6.9z" fill="var(--nb1)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 1.5h5Q19 10.5 24 1.5h5v5.4q1.4 7.6 7.5 8.6V42.5H1.5V15.5Q7.6 14.5 9 6.9z" fill="url(#rgG)"/><path d="M15.5 1.5Q20 10 24.5 1.5" fill="none" stroke="var(--sub)" stroke-width="1.4" opacity=".0"/></svg>';
function montaSF(T){ const m=modeloReal(T); document.body.classList.toggle('semFoto',m==='sem');
  $('fModAv').textContent=MODELO==='auto'?'Automático → '+(m==='sem'?'sem fotos':'com fotos'):'';
  if(m!=='sem'){ $('sf').innerHTML=''; return; }
  const C=temasDuelo(T.A.sig,T.B.sig);
  const cab=l=>{ const t=T[l], nm=String(t.nome||'').toUpperCase(); const fs=Math.min(3.9,44/Math.max(nm.length,1)); return `<div class="sfCab ${l.toLowerCase()}" style="${estilo(C[l])}" onclick="sfVer('${l}')" title="Mostrar só ${esc(t.nome)}"><div class="brd"></div><div class="fun"></div><img src="${esc(escudo(t.sig))}" alt=""><div class="nm"><b style="font-size:${fs}cqw">${esc(nm)}</b><i>Basquete</i></div></div>`; };
  const pn=l=>{ const t=T[l]; return `<div class="sfPn ${l.toLowerCase()}" id="sf${l}" style="${estilo(C[l])}"><div class="tit">ESCALAÇÃO</div><div class="cx">${t.js.map((a,i)=>{ const nm=nome2(a.nome).toUpperCase(), ap=''; /* sem apelido no modelo sem fotos: estava cortando; o Klaus fala o apelido (Magno, 24/11/2026) */ const fs=Math.min(2.1,(34-(ap?ap.length*.7:0))/Math.max(nm.length,1)*1.25); return `<div class="sfLn" onclick="ficha('${l}',${i})"><div class="n rg">${REGATA}<b>${esc(String(a.numero||'-').replace(/^0(\d)$/,'$1'))}</b></div><div class="p" style="font-size:${Math.max(1.3,fs).toFixed(2)}cqw">${esc(nm)}${ap?'<small>'+esc(ap)+'</small>':''}</div></div>`; }).join('')}</div>${t.tec?`<div class="sfTec">Técnico: <b>${esc(tecCurto(t.tec).n)}</b></div>`:''}</div>`; };
  const cat=String(J&&J.categoria||'').toUpperCase();
  $('sf').innerHTML=SF_DEFS+['tl','bl'].map(k=>`<div class="sfDeco ${k}">${decoSF(C.A.acc)}</div>`).join('')+['tr','br'].map(k=>`<div class="sfDeco ${k}">${decoSF(C.B.acc)}</div>`).join('')+cab('A')+`<div class="sfMeio" onclick="sfVer('AB')" title="Mostrar os dois times"><img src="logo_klaustv_tv.png" alt=""><div class="lin"></div><div class="tx"><b class="site">klaustv.com</b></div></div><div class="sfBol"><i data-v="A" style="background:${C.A.acc}" onclick="sfVer('A')" title="Só ${esc(T.A.nome)}"></i><i data-v="AB" onclick="sfVer('AB')" title="Os dois times"></i><i data-v="B" style="background:${C.B.acc}" onclick="sfVer('B')" title="Só ${esc(T.B.nome)}"></i></div>`+cab('B')+pn('A')+pn('B');
  // os dois escudos com a mesma área; se um for largo demais e precisar encolher, o outro encolhe na mesma medida (nunca um maior que o outro)
  const ims=[...document.querySelectorAll('.sfCab img')];
  Promise.all(ims.map(im=>im.complete&&im.naturalWidth?1:new Promise(ok=>{ im.addEventListener('load',ok,{once:true}); im.addEventListener('error',ok,{once:true}); }))).then(()=>{
    const rs=ims.map(im=>im.naturalWidth/im.naturalHeight||1); const k=Math.min(1,...rs.map(r=>(105/r)/(132*Math.sqrt(.8/r))));
    ims.forEach((im,i)=>im.style.setProperty('--eh',(132*Math.sqrt(.8/rs[i])*k).toFixed(1)+'%')); });
  sfVer(SF_VER); }
// clique no escudo/nome do time: só aquele time; clique no Klaus TV: os dois (Magno, 23/11/2026)
// 23/11/2026 (Magno): o time escondido some inteiro (escudo, nome, lista e pinceladas do canto)
function sfVer(v){ SF_VER=v; ['A','B'].forEach(l=>{ const k=l.toLowerCase(), mostra=v.indexOf(l)>=0;
    document.querySelectorAll('#sf .sfPn.'+k+',#sf .sfCab.'+k+(l==='A'?',#sf .sfDeco.tl,#sf .sfDeco.bl':',#sf .sfDeco.tr,#sf .sfDeco.br')).forEach(e=>e.classList.toggle('off',!mostra)); });
  document.querySelectorAll('#sf .sfBol i').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); $('ficha').classList.remove('on'); }
// quadrado do Klaus TV dividido em 3 partes invisíveis: esquerda = time A, meio = os dois, direita = time B
function sfMeio(ev,el){ const r=el.getBoundingClientRect(), x=(ev.clientX-r.left)/r.width; sfVer(x<1/3?'A':x>2/3?'B':'AB'); }

let ULT=''; try{ ULT=localStorage.getItem('kt_esc_jogo')||''; }catch(e){}
const HD=/[#&]d=([^&]+)/.exec(location.hash);
const SCOUT=Q.has('scout');
// ===== Escalação ligada ao Scout (Magno, 24/11/2026): pergunta a cada 5 s qual jogo está aberto no Scout e mostra a escalação dele (JSONP, funciona no OBS) =====
function jp(par){ return new Promise(ok=>{ const cb='kt_es'+Math.random().toString(36).slice(2,9), sc=document.createElement('script'); let feito=false;
  const fim=r=>{ if(feito) return; feito=true; delete window[cb]; sc.remove(); ok(r||{ok:false,erro:'sem resposta'}); };
  window[cb]=fim; sc.onerror=()=>fim(null); setTimeout(()=>fim(null),20000);
  sc.src=KT_API+'?'+new URLSearchParams(Object.assign({},par,{callback:cb,_:Date.now()})).toString(); document.head.appendChild(sc); }); }
let SC_ID='', SC_OCUP=false;
async function scoutLoop(){ if(SC_OCUP) return; SC_OCUP=true;
  try{ const r=await jp({acao:'placar'});
    if(!(r&&r.ok&&r.id)){ if(!J&&!document.body.classList.contains('obs')) $('times').innerHTML='<div class="msg">Aguardando o jogo aberto no Scout…</div>'; return; }
    if(r.id===SC_ID) return;
    const x=await jp({acao:'escalacaoJogo',id:r.id}); if(!(x&&x.ok&&x.jogo)) return;
    SC_ID=r.id; document.body.classList.add('temJogo'); J=x.jogo; FOTOS=x.fotos||{}; APS=x.apelidos||{}; CAMS=x.camisas||{}; PRE=null; TEMP=null; SF_VER='AB';
    camBanco(); fotoTec(); monta();
    const ano=String(J.dataHora||'').slice(0,4)||String(new Date().getFullYear());
    if(J.categoria) jp({acao:'atletasKT',categoria:J.categoria,ano}).then(t=>{ if(SC_ID!==r.id) return; TEMP=(t&&t.ok)?t:{ok:false}; const l=$('tB')&&$('tB').classList.contains('on')?'B':'A'; monta(); aba(l); });
  } finally{ SC_OCUP=false; } }
if(SCOUT){ scoutLoop(); setInterval(scoutLoop,5000); }
else if(HD){ try{ dePacote(HD[1]); document.body.classList.add('temJogo'); monta(); }catch(e){ $('times').innerHTML='<div class="msg">Endereço incompleto. Copie de novo a URL de saída no site.</div>'; } }
else if(Q.get('jogo')) abrir(Q.get('jogo')); else if(ULT) abrir(ULT); else $('times').innerHTML='<div class="msg">Escolha a categoria, o time e o jogo nos filtros do canto.</div>';
if(!HD&&!SCOUT) carregarLista(); // abre o último jogo escolhido
</script>
